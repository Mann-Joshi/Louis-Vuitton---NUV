<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAISON | Luxury Redefined</title>
    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .brand-logo {
            font-family: 'Didot', 'Bodoni MT', 'Times New Roman', serif;
            font-weight: normal;
        }

        a {
            text-decoration: none;
            color: #000000;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid #eeeeee;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-logo {
            font-size: 2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .nav-icons {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2); /* Subtle dark overlay */
            z-index: 1;
        }

        .hero-content {
            z-index: 2;
        }

        .hero h1 {
            font-size: 4rem;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .btn-light {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 3rem;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .btn-light:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Featured Categories */
        .categories {
            padding: 6rem 3rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .category-card {
            position: relative;
            height: 80vh;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }

        .category-card:hover img {
            transform: scale(1.05);
        }

        .category-content {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .category-content h2 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 1rem;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }

        .btn-dark {
            display: inline-block;
            padding: 0.8rem 2.5rem;
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .btn-dark:hover {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
        }

        /* Footer */
        footer {
            padding: 4rem 3rem;
            background-color: #fafafa;
            text-align: center;
            border-top: 1px solid #eeeeee;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .footer-links a {
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #555555;
        }

        .footer-links a:hover {
            color: #000000;
        }

        .copyright {
            font-size: 0.7rem;
            color: #999999;
            letter-spacing: 1px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .categories {
                grid-template-columns: 1fr;
                padding: 3rem 1.5rem;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <nav class="nav-links">
            <a href="#">Women</a>
            <a href="#">Men</a>
            <a href="#">Art of Gifting</a>
        </nav>
        <div class="brand-logo">MAISON</div>
        <div class="nav-icons">
            <a href="#">Search</a>
            <a href="#">Cart (0)</a>
        </div>
    </header>

    <!-- Main Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>The Fall Collection</h1>
            <a href="#" class="btn-light">Discover Now</a>
        </div>
    </section>

    <!-- Featured Categories Grid -->
    <section class="categories">
        <div class="category-card">
            <!-- Image by Unsplash -->
            <img src="https://images.unsplash.com/photo-1584916201218-f4242ceb4809?q=80&w=1915&auto=format&fit=crop" alt="Luxury Bags">
            <div class="category-content">
                <h2>Leather Goods</h2>
                <a href="#" class="btn-dark">Shop Collection</a>
            </div>
        </div>
        <div class="category-card">
            <!-- Image by Unsplash -->
            <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=1974&auto=format&fit=crop" alt="Ready to Wear">
            <div class="category-content">
                <h2>Ready-to-Wear</h2>
                <a href="#" class="btn-dark">Shop Collection</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="#">Client Services</a>
            <a href="#">Boutiques</a>
            <a href="#">Sustainability</a>
            <a href="#">Legal & Privacy</a>
        </div>
        <div class="copyright">
            &copy; 2026 MAISON. ALL RIGHTS RESERVED.
        </div>
    </footer>

</body>
</html>
